name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Version Code
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Persistent Keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating new persistent keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git add android/app/debug.keystore
            git commit -m "chore: add persistent debug keystore for consistent signing"
            git push
          else
            echo "Using existing keystore."
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION-${{ github.run_number }}"
          gh release create $TAG android/app/build/outputs/apk/debug/app-debug.apk --title "Lugh Finance $TAG" --notes "Automated build for version $VERSION. Download the APK below to update."
